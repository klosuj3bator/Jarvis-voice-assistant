# Testy Jarvisa (pytest) przy każdym pushu i pull requeście.
#
# - Windows, bo część kodu działa tylko tam (pywin32, ścieżki, Eksplorator).
# - Tylko lekkie zależności z requirements-test.txt: bez modeli Whispera,
#   embeddingów, Qt i bibliotek audio — testy mają na nie atrapy.
# - Bez kluczy i sekretów: testy nie łączą się z siecią (tests/conftest.py
#   blokuje każde połączenie), Claude, Spotify, Gmail i Telegram to atrapy.
name: Testy

on:
  push:
  pull_request:

# Workflow tylko czyta repozytorium — niczego nie zapisuje ani nie publikuje.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"               # polskie znaki w nazwach i komunikatach testów
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-dev.txt

      - name: Zależności testów
        run: python -m pip install -r requirements-test.txt

      - name: Testy
        run: python -m pytest -rs
